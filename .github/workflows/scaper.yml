name: Weekly Scraper

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        city: [warszawa, wroclaw, lodz, krakow, poznan, gdansk, szczecin, lublin, bialystok, katowice]
        include:
          - city: warszawa
            pages: 11
          - city: wroclaw
            pages: 9
          - city: lodz
            pages: 8
          - city: krakow
            pages: 10
          - city: poznan
            pages: 8
          - city: gdansk
            pages: 8
          - city: szczecin
            pages: 6
          - city: lublin
            pages: 6
          - city: bialystok
            pages: 5
          - city: katowice
            pages: 7

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: |
          python scraper/scrape.py \
            --city ${{ matrix.city }} \
            --pages ${{ matrix.pages }} \
            --output scraper/data/ogloszenia_${{ matrix.city }}.csv

      - name: Run detailed scraper
        run: |
          python scraper/scrape_more.py \
            --input scraper/data/ogloszenia_${{ matrix.city }}.csv \
            --output scraper/data/ogloszenia_${{ matrix.city }}_detailed.csv \
            --delay 0.01

      - name: Clean data
        run: |
          python scraper/clean_data.py \
            scraper/data/ogloszenia_${{ matrix.city }}_detailed.csv \
            --remove-price-ask

      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: scraped-data-${{ matrix.city }}
          path: |
            scraper/data/ogloszenia_${{ matrix.city }}.csv
            scraper/data/ogloszenia_${{ matrix.city }}_detailed.csv
            scraper/data/ogloszenia_${{ matrix.city }}_cleaned.csv

  commit-results:
    needs: run-scraper
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: scraper/data/

      - name: Commit and push updated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f scraper/data/**/*.csv
          git commit -m "Update scraped data [$(date +'%Y-%m-%d %H:%M:%S')]" || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
